@let user = auth.user();

<div class="flex min-h-dvh flex-col bg-[var(--mat-sys-surface-container-low)]">
  <admin-header [compact]="auth.authenticated() && compact()"
              [loading]="auth.loading()"
              [authenticated]="auth.authenticated()"
              [userName]="user?.name ?? user?.email ?? null"
              (navigationToggle)="toggleNavigation()"
              (signIn)="login()"
                (signOut)="auth.logout()" />

  @if (auth.authenticated()) {
  <mat-sidenav-container class="min-h-0 flex-1 bg-[var(--mat-sys-surface-container-low)]"
                         [autosize]="true">
    <mat-sidenav #sidenav
                 id="app-navigation-drawer"
                 class="app-navigation-drawer"
                 [class.app-navigation-drawer-collapsed]="collapsed()"
                 [mode]="compact() ? 'over' : 'side'"
                 [opened]="!compact()">
      <admin-navigation [navigation]="navigation()"
                        [collapsed]="collapsed()"
                        [collapsible]="!compact()"
                        (collapseToggle)="toggleNavigationCollapsed()"
                        (sectionSelected)="selectSection()" />
    </mat-sidenav>

    <mat-sidenav-content>
      <main id="content"
            class="mx-auto w-full max-w-[90rem] p-4 sm:p-6 lg:p-10">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <main id="content"
        class="mx-auto w-full max-w-[90rem] flex-1 p-4 sm:p-6 lg:p-10">
    <router-outlet />
  </main>
}
</div>
