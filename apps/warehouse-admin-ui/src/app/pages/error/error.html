<ui-error-state>
  <span errorEyebrow>Error {{ status() }}</span>

  <h1 errorTitle
      class="m-0 text-3xl font-bold tracking-tight text-[var(--mat-sys-on-surface)] sm:text-5xl">
    {{ content().title }}
  </h1>
  <p errorDescription>{{ content().description }}</p>

  <div errorActions>
    <a mat-flat-button
       routerLink="/">Return to welcome</a>
    @if (status() === 403) {
      <button mat-stroked-button
              type="button"
              (click)="auth.logout()">Sign out</button>
    }
  </div>
</ui-error-state>
