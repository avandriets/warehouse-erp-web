<div class="flex h-full min-h-0 flex-col">
  <nav class="flex-1"
       aria-label="Administration sections">
    @for (item of navigation(); track $index) {
      @if ('children' in item) {
        <div class="border-b border-[var(--mat-sys-outline-variant)]"
             routerLinkActive="app-navigation-group-active">
          @if (!collapsed()) {
            <button mat-button
                    type="button"
                    class="app-navigation-group h-16! w-full justify-start! rounded-none! px-5!"
                    [attr.aria-expanded]="!closedGroups().has(item.id)"
                    [attr.aria-controls]="'navigation-' + item.id"
                    (click)="toggleGroup(item.id)">
              <span class="flex w-full items-center gap-4 text-base">
                <mat-icon class="shrink-0"
                          aria-hidden="true">{{ item.icon }}</mat-icon>
                <span class="flex-1 text-left">{{ item.title }}</span>
                <mat-icon class="shrink-0 text-[var(--mat-sys-on-surface-variant)]"
                          aria-hidden="true">
                  {{ closedGroups().has(item.id) ? 'chevron_right' : 'expand_more' }}
                </mat-icon>
              </span>
            </button>
          }
          <mat-nav-list [id]="'navigation-' + item.id"
                        [hidden]="!collapsed() && closedGroups().has(item.id)"
                        [attr.aria-label]="item.title">
            @for (child of item.children; track child.path) {
              <a mat-list-item
                 class="app-navigation-link h-13! rounded-none! border-t border-[var(--mat-sys-outline-variant)]"
                 routerLinkActive="app-navigation-active"
                 ariaCurrentWhenActive="page"
                 matTooltipPosition="right"
                 [routerLink]="child.path"
                 [routerLinkActiveOptions]="{ exact: child.exact }"
                 [attr.aria-label]="child.title"
                 [matTooltip]="child.title"
                 [matTooltipDisabled]="!collapsed()"
                 (click)="sectionSelected.emit()">
                <ng-container [ngTemplateOutlet]="linkContent"
                              [ngTemplateOutletContext]="{ item: child, nested: true }"/>
              </a>
            }
          </mat-nav-list>
        </div>
      } @else {
        <mat-nav-list>
          <a mat-list-item
             class="app-navigation-link h-13! rounded-none! border-b border-[var(--mat-sys-outline-variant)]"
             routerLinkActive="app-navigation-active"
             ariaCurrentWhenActive="page"
             matTooltipPosition="right"
             [routerLink]="item.path"
             [routerLinkActiveOptions]="{ exact: item.exact }"
             [attr.aria-label]="item.title"
             [matTooltip]="item.title"
             [matTooltipDisabled]="!collapsed()"
             (click)="sectionSelected.emit()">
            <ng-container [ngTemplateOutlet]="linkContent"
                          [ngTemplateOutletContext]="{ item, nested: false }"/>
          </a>
        </mat-nav-list>
      }
    }
  </nav>

  <ng-template #linkContent
               let-item="item"
               let-nested="nested">
    <span class="flex items-center gap-4">
      <mat-icon class="shrink-0"
                aria-hidden="true">{{ item.icon }}</mat-icon>
      @if (!collapsed()) {
        <span class="text-base"
              [class.font-medium]="!nested">{{ item.title }}</span>
      }
    </span>
  </ng-template>

  <div class="mt-auto border-t border-[var(--mat-sys-outline-variant)]">
    @if (collapsible()) {
      <button mat-button
              type="button"
              class="app-navigation-collapse h-13! w-full justify-start! rounded-none! px-5!"
              aria-controls="app-navigation-drawer"
              matTooltipPosition="right"
              [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
              [attr.aria-expanded]="!collapsed()"
              [matTooltip]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
              (click)="collapseToggle.emit()">
        <span class="flex w-full items-center gap-4"
              [class.justify-center]="collapsed()">
          <mat-icon class="shrink-0"
                    aria-hidden="true">
            {{ collapsed() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}
          </mat-icon>
          @if (!collapsed()) {
            <span>Collapse sidebar</span>
          }
        </span>
      </button>
    }
  </div>
</div>
