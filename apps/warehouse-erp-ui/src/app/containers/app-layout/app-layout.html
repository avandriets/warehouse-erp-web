@let user = auth.user();

<div class="flex min-h-dvh flex-col bg-[var(--mat-sys-surface)] text-[var(--mat-sys-on-surface)]">
  <erp-header [loading]="auth.loading()"
              [authenticated]="auth.authenticated()"
              [userName]="user?.name ?? user?.email ?? null"
              (signIn)="login()"
              (signOut)="auth.logout()" />

  <main id="content"
        class="mx-auto flex w-full max-w-[90rem] flex-1 p-4 sm:p-6 lg:p-10">
    <router-outlet />
  </main>
</div>
