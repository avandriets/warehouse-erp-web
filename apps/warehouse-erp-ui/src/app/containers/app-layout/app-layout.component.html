<div class="flex h-dvh w-full overflow-hidden bg-surface text-on-surface">
  <erp-primary-menu [primaryMenu]="primaryMenu"
                    [activePrimaryMenuId]="activePrimaryMenuId()"
                    [sidebarOpen]="sidebarOpen()"
                    (primaryMenuChange)="selectPrimaryMenu($event)"
                    (sidebarToggle)="toggleSidebar()">
    <a railHeader
       routerLink="/"
       matTooltip="Home"
       matTooltipPosition="right"
       aria-label="Home"
       class="grid cursor-pointer size-11 place-items-center rounded-xl text-muted transition-colors hover:bg-hover hover:text-on-surface"
       [attr.aria-current]="activePrimaryMenuId() === null ? 'page' : null"
       [class.bg-selected]="activePrimaryMenuId() === null"
       [class.text-on-selected]="activePrimaryMenuId() === null">
      <mat-icon>home</mat-icon>
    </a>

    <button railFooter
            type="button"
            matTooltip="Sign out"
            matTooltipPosition="right"
            class="grid size-9 cursor-pointer place-items-center rounded-full bg-primary text-on-primary"
            [attr.aria-label]="'Sign out ' + session.userName()"
            (click)="session.logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </erp-primary-menu>

  @if (currentPrimaryMenuItem() || sidebarOpen()) {
    <div class="shrink-0 overflow-hidden motion-safe:transition-[width] motion-safe:duration-200 motion-safe:ease-out"
         [class.w-sidebar]="sidebarOpen()"
         [class.w-0]="!sidebarOpen()"
         [attr.inert]="sidebarOpen() ? null : ''">
      <div class="h-full w-sidebar">
        <erp-submenu [heading]="sidebarHeading()"
                     [groups]="sidebarGroups()"
                     [selectedId]="selectedItemId()" />
      </div>
    </div>
  }


  <main class="min-w-0 flex-1 overflow-auto bg-surface p-6">
    <router-outlet />
  </main>
</div>
