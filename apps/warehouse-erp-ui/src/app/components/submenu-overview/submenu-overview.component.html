@if (currentPrimaryMenuItem(); as primaryMenuItem) {
  <div class="flex min-h-full justify-center">
    <div class="w-full max-w-5xl">
      <div class="mb-6">
        <a mat-button
           routerLink="/">
          <mat-icon>arrow_back</mat-icon>
          Home
        </a>
        <h1 class="text-2xl font-semibold text-on-surface">{{ primaryMenuItem.title }}</h1>
        <p class="mt-2 text-base leading-7 text-muted">Choose a page to continue.</p>
      </div>

      @for (group of primaryMenuItem.groups; track group.id) {
        <section class="mb-6">
          <h2 class="mb-3 text-base font-medium text-muted">{{ group.title }}</h2>
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            @for (item of group.items; track item.id) {
              <erp-navigation-card [route]="item.route"
                                   [icon]="item.icon ?? primaryMenuItem.icon"
                                   [title]="item.title"
                                   [description]="item.description"
                                   [compact]="true"/>
            }
          </div>
        </section>
      }
    </div>
  </div>
}
