<aside class="flex h-dvh w-[320px] shrink-0 flex-col border-r border-outline bg-sidebar/60">
  <!-- Header -->
  <header class="flex h-16 shrink-0 items-center gap-2 px-4">
    <button type="button"
            class="flex min-w-0 items-center gap-1.5 rounded-lg px-2 py-1.5 text-lg font-semibold text-on-surface transition-colors hover:bg-hover/70">
      <span class="truncate">
        {{ title() }}
      </span>

      <mat-icon class="!h-5 !w-5 !text-[18px] text-muted">
        expand_more
      </mat-icon>
    </button>

    <div class="ml-auto flex items-center gap-0.5">
      <!-- Notifications -->
      <button type="button"
              class="grid size-9 place-items-center rounded-lg text-muted transition-colors hover:bg-hover/70 hover:text-on-surface">
        <mat-icon class="!text-[21px]">
          notifications_none
        </mat-icon>
      </button>

      <!-- Search -->
      <button type="button"
              class="grid size-9 place-items-center rounded-lg text-muted transition-colors hover:bg-hover/70 hover:text-on-surface">
        <mat-icon class="!text-[21px]">
          search
        </mat-icon>
      </button>
    </div>
  </header>

  <!-- New operation -->
  <div class="px-3">
    <button type="button"
            class="flex h-10 w-full items-center gap-3 rounded-lg px-3 text-left text-[15px] font-medium text-on-surface transition-colors hover:bg-hover/70">
      <mat-icon class="!text-[20px]">
        edit_square
      </mat-icon>

      <span>
        New operation
      </span>
    </button>
  </div>

  <!-- Scrollable sidebar content -->
  <div class="min-h-0 flex-1 overflow-y-auto px-3 pb-6 pt-5">
    @for (group of groups(); track group.title) {
      <section class="mb-6">
        <h3 class="mb-1.5 px-3 text-sm font-medium text-muted">
          {{ group.title }}
        </h3>

        <div>
          @for (item of group.items; track item.id) {
            <div class="group relative">
              <button type="button"
                      class="flex h-9 w-full items-center rounded-xl px-3 text-left text-[14px] transition-colors hover:bg-hover/60"
                      [class.bg-selected]="selectedId() === item.id"
                      [class.text-on-selected]="selectedId() === item.id"
                      [class.font-medium]="selectedId() === item.id"
                      (click)="select(item.id)">
                <span class="min-w-0 flex-1 truncate pr-6">
                  {{ item.title }}
                </span>
              </button>

              <button type="button"
                      class="absolute right-1 top-1/2 grid size-7 -translate-y-1/2 place-items-center rounded-md text-muted opacity-0 transition-all hover:bg-hover/70 hover:text-on-surface group-hover:opacity-100"
                      [matMenuTriggerFor]="itemMenu">
                <mat-icon class="!text-[18px]">
                  more_horiz
                </mat-icon>
              </button>
            </div>
          }
        </div>
      </section>
    }
  </div>
</aside>

<mat-menu #itemMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>push_pin</mat-icon>
    <span>Pin</span>
  </button>

  <button mat-menu-item>
    <mat-icon>edit</mat-icon>
    <span>Rename</span>
  </button>

  <button mat-menu-item>
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>
