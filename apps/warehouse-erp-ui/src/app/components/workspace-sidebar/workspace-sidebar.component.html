<aside class="flex h-dvh w-sidebar shrink-0 flex-col border-r border-outline bg-sidebar">
  <header class="flex h-16 shrink-0 items-center px-4">
    <h2 class="truncate px-2 text-lg font-semibold text-on-surface">{{ heading() }}</h2>
  </header>
  <div class="min-h-0 flex-1 overflow-y-auto px-3 pb-6 pt-5">
    @for (group of groups(); track group.title) {
      <section class="mb-6">
        <h3 class="mb-1.5 px-3 text-sm font-medium text-muted">{{ group.title }}</h3>
        @for (item of group.items; track item.id) {
          <button type="button"
                  class="flex cursor-pointer min-h-9 w-full items-center rounded-xl px-3 py-2 text-left text-sm transition-colors hover:bg-hover"
                  [attr.aria-current]="selectedId() === item.id ? 'page' : null"
                  [class.bg-selected]="selectedId() === item.id"
                  [class.text-on-selected]="selectedId() === item.id"
                  [class.font-medium]="selectedId() === item.id"
                  (click)="itemSelect.emit(item.id)">
            <span class="min-w-0 flex-1">{{ item.title }}</span>
          </button>
        }
      </section>
    }
  </div>
</aside>
