<aside class="relative flex h-dvh shrink-0 flex-col overflow-hidden bg-sidebar transition-[width] duration-200 ease-out"
       [class.w-[260px]]="!collapsed()"
       [class.w-[68px]]="collapsed()">
  <!-- Header -->
  <div class="flex h-14 items-center justify-between px-3">
    @if (!collapsed()) {
      <div class="flex items-center gap-2">
        <div class="grid size-8 place-items-center rounded-full bg-inverse-surface text-sm font-semibold text-on-inverse-surface">
          A
        </div>

        <span class="text-sm font-semibold">
          Workspace
        </span>
      </div>
    }

    <button type="button"
            matTooltip="Toggle sidebar"
            class="grid size-9 shrink-0 place-items-center rounded-lg text-muted transition-colors hover:bg-hover/70 hover:text-on-surface"
            (click)="toggle()">
      <mat-icon class="!text-[20px]">
        {{ collapsed() ? 'dock_to_right' : 'dock_to_left' }}
      </mat-icon>
    </button>
  </div>

  <!-- New chat -->
  <div class="px-3 pt-1">
    <button type="button"
            class="flex h-10 w-full items-center rounded-lg text-sm font-medium text-on-surface transition-colors hover:bg-hover/70"
            [class.justify-center]="collapsed()"
            [class.gap-3]="!collapsed()"
            [class.px-2]="!collapsed()">
      <mat-icon class="!text-[20px]">
        edit_square
      </mat-icon>

      @if (!collapsed()) {
        <span>New chat</span>
      }
    </button>
  </div>

  <!-- Search -->
  <div class="px-3 pt-1">
    <button type="button"
            class="flex h-10 w-full items-center rounded-lg text-sm text-on-surface transition-colors hover:bg-hover/70"
            [class.justify-center]="collapsed()"
            [class.gap-3]="!collapsed()"
            [class.px-2]="!collapsed()">
      <mat-icon class="!text-[20px]">
        search
      </mat-icon>

      @if (!collapsed()) {
        <span>Search chats</span>
      }
    </button>
  </div>

  <!-- Chats -->
  @if (!collapsed()) {
    <div class="mt-5 min-h-0 flex-1 overflow-y-auto px-2">
      <div class="px-2 pb-2 text-xs font-medium text-muted">
        Chats
      </div>

      <div class="space-y-0.5">
        @for (chat of chats(); track chat.id) {
          <div class="group flex h-9 items-center rounded-lg px-2 text-sm text-on-surface transition-colors hover:bg-hover/70">
            <button type="button"
                    class="min-w-0 flex-1 truncate text-left">
              {{ chat.title }}
            </button>

            <button type="button"
                    class="grid size-7 shrink-0 place-items-center rounded-md opacity-0 transition-opacity hover:bg-hover/70 group-hover:opacity-100"
                    [matMenuTriggerFor]="chatMenu">
              <mat-icon class="!text-[18px]">
                more_horiz
              </mat-icon>
            </button>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="flex-1"></div>
  }

  <!-- User -->
  <div class="p-2">
    <button type="button"
            class="flex h-12 w-full items-center rounded-xl transition-colors hover:bg-hover/70"
            [matMenuTriggerFor]="userMenu"
            [class.justify-center]="collapsed()"
            [class.gap-3]="!collapsed()"
            [class.px-2]="!collapsed()">
      <div class="grid size-8 shrink-0 place-items-center rounded-full bg-inverse-surface text-xs font-semibold text-on-inverse-surface">
        AA
      </div>

      @if (!collapsed()) {
        <div class="min-w-0 flex-1 text-left">
          <div class="truncate text-sm font-medium">
            Alexander
          </div>

          <div class="truncate text-xs text-muted">
            Personal
          </div>
        </div>

        <mat-icon class="!text-[18px] text-muted">
          more_horiz
        </mat-icon>
      }
    </button>
  </div>
</aside>

<mat-menu #chatMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>edit</mat-icon>
    Rename
  </button>

  <button mat-menu-item>
    <mat-icon>archive</mat-icon>
    Archive
  </button>

  <button mat-menu-item>
    <mat-icon>delete</mat-icon>
    Delete
  </button>
</mat-menu>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    Settings
  </button>

  <button mat-menu-item>
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-menu>
