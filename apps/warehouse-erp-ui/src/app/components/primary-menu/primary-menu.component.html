<aside class="flex h-dvh w-16 shrink-0 flex-col border-r border-outline bg-sidebar py-3">
  <nav class="flex flex-1 flex-col items-center gap-1.5">
    <!-- Sidebar toggle -->
    <button matTooltip="{{ sidebarOpen() ? 'Close sidebar' : 'Open sidebar' }}"
            type="button"
            matTooltipPosition="right"
            class="mb-2 grid cursor-pointer size-11 place-items-center rounded-xl text-muted transition-colors hover:bg-hover hover:text-on-surface"
            [attr.aria-label]="sidebarOpen() ? 'Close sidebar' : 'Open sidebar'"
            (click)="sidebarToggle.emit()">
      <mat-icon>
        {{ sidebarOpen() ? 'chevron_left' : 'chevron_right' }}
      </mat-icon>
    </button>

    <ng-content select="[railHeader]" />

    @for (primaryMenuItem of primaryMenu(); track primaryMenuItem.id) {
      <button type="button"
              matTooltipPosition="right"
              class="grid cursor-pointer size-11 place-items-center rounded-xl text-muted transition-colors hover:bg-hover hover:text-on-surface"
              [matTooltip]="primaryMenuItem.title"
              [attr.aria-label]="primaryMenuItem.title"
              [attr.aria-current]="activePrimaryMenuId() === primaryMenuItem.id ? 'true' : null"
              [class.bg-selected]="activePrimaryMenuId() === primaryMenuItem.id"
              [class.text-on-selected]="activePrimaryMenuId() === primaryMenuItem.id"
              (click)="primaryMenuChange.emit(primaryMenuItem.id)">
        <mat-icon>
          {{ primaryMenuItem.icon }}
        </mat-icon>
      </button>
    }

    <ng-content select="[railActions]" />
  </nav>

  <div class="flex justify-center">
    <ng-content select="[railFooter]" />
  </div>
</aside>
