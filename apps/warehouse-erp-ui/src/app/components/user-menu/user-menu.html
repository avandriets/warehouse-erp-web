<button #trigger="matMenuTrigger"
        type="button"
        matTooltipPosition="right"
        class="grid size-11 cursor-pointer place-items-center rounded-xl transition-colors hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [matTooltip]="userName()"
        [matMenuTriggerFor]="accountMenu"
        [attr.aria-label]="'Account menu for ' + userName()"
        [class.bg-selected]="trigger.menuOpen">
  <span aria-hidden="true"
        class="grid size-8 place-items-center rounded-full bg-primary text-xs font-semibold text-on-primary">{{ initials() }}</span>
</button>

<mat-menu #accountMenu="matMenu"
          yPosition="above"
          xPosition="after"
          [overlapTrigger]="false">
  <div class="flex w-64 max-w-full items-center gap-3 px-4 py-3">
    <span aria-hidden="true"
          class="grid size-10 shrink-0 place-items-center rounded-full bg-primary text-sm font-semibold text-on-primary">{{ initials() }}</span>
    <div class="min-w-0">
      <p class="m-0 break-words text-sm font-semibold text-on-surface">{{ userName() }}</p>
      @if (email()) {
        <p class="m-0 mt-1 break-all text-xs text-muted">{{ email() }}</p>
      }
    </div>
  </div>
  <mat-divider />
  <button mat-menu-item
          type="button"
          (click)="signOut.emit()">
    <mat-icon>logout</mat-icon>
    <span>Sign out</span>
  </button>
</mat-menu>
