<div class="mx-auto w-full max-w-5xl">
  <ui-error-state>
    <span errorEyebrow>{{ notFound() ? 'Page not found' : 'Not available yet' }}</span>
    <h1 errorTitle
        class="text-2xl font-semibold text-on-surface">{{ heading() }}</h1>
    <p errorDescription>{{ notFound() ? 'The requested page could not be found.' : 'This page is not available yet.' }}</p>
    <a errorActions
       mat-button
       [routerLink]="primaryMenuRoute()">{{ notFound() ? 'All sections' : 'Back to section' }}</a>
  </ui-error-state>
</div>
