<div class="flex min-h-full justify-center px-8 py-16">
  <div class="w-full max-w-5xl">

    <!-- Heading -->
    <div class="mb-12">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.22em] text-primary">
        Warehouse ERP
      </p>

      <h1 class="max-w-3xl text-4xl font-semibold tracking-tight text-on-surface sm:text-5xl">
        Welcome back, Alexander
      </h1>

      <p class="mt-4 max-w-2xl text-base leading-7 text-muted">
        Manage inventory, warehouse operations,
        purchasing and sales from one workspace.
      </p>
    </div>

    <!-- Quick actions -->
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <button type="button"
              class="group rounded-2xl border border-outline p-5 text-left transition-all hover:border-outline-strong hover:bg-sidebar">
        <div class="mb-5 grid size-10 place-items-center rounded-xl bg-surface-container text-on-surface transition-colors group-hover:bg-hover">
          <mat-icon>
            inventory_2
          </mat-icon>
        </div>

        <div class="font-medium text-on-surface">
          Stock overview
        </div>

        <div class="mt-1 text-sm leading-5 text-muted">
          View current warehouse balances.
        </div>
      </button>

      <button type="button"
              class="group rounded-2xl border border-outline p-5 text-left transition-all hover:border-outline-strong hover:bg-sidebar">
        <div class="mb-5 grid size-10 place-items-center rounded-xl bg-surface-container text-on-surface transition-colors group-hover:bg-hover">
          <mat-icon>
            input
          </mat-icon>
        </div>

        <div class="font-medium text-on-surface">
          Receive goods
        </div>

        <div class="mt-1 text-sm leading-5 text-muted">
          Create a new goods receipt.
        </div>
      </button>

      <button type="button"
              class="group rounded-2xl border border-outline p-5 text-left transition-all hover:border-outline-strong hover:bg-sidebar">
        <div class="mb-5 grid size-10 place-items-center rounded-xl bg-surface-container text-on-surface transition-colors group-hover:bg-hover">
          <mat-icon>
            swap_horiz
          </mat-icon>
        </div>

        <div class="font-medium text-on-surface">
          Transfer stock
        </div>

        <div class="mt-1 text-sm leading-5 text-muted">
          Move goods between warehouses.
        </div>
      </button>
    </div>

  </div>
</div>
