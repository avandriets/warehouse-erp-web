<div class="flex min-h-full justify-center">
  <div class="w-full max-w-5xl">
    <div class="mb-6">
      <h1 class="text-2xl font-semibold text-on-surface">
        Welcome to Warehouse ERP
      </h1>
      <p class="mt-4 text-base leading-7 text-muted">Choose a section to get started.</p>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      @for (primaryMenuItem of primaryMenu; track primaryMenuItem.id) {
        <erp-navigation-card [route]="primaryMenuItem.route"
                             [icon]="primaryMenuItem.icon"
                             [title]="primaryMenuItem.title"
                             [description]="primaryMenuItem.description" />
      }
    </div>
  </div>
</div>
