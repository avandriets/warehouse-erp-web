<mat-form-field appearance="outline"
                subscriptSizing="dynamic"
                class="w-full">
  <span matTextPrefix
        class="mr-3 shrink-0 text-xs text-[var(--mat-sys-on-surface-variant)]">Status</span>
  <mat-select aria-label="Status"
              [formControl]="control">
    <mat-option value="">All users</mat-option>
    <mat-option value="INVITED">Invited
    </mat-option>
    <mat-option value="PENDING_APPROVAL">Pending approval</mat-option>
    <mat-option value="ACTIVE">Active</mat-option>
    <mat-option value="SUSPENDED">Suspended
    </mat-option>
  </mat-select>
</mat-form-field>
