<h2 mat-dialog-title>{{ record ? 'Edit user' : 'New user' }}</h2>
<form [formGroup]="form"
      (ngSubmit)="save()">
  <mat-dialog-content>
    @if (actionError()) {
      <p role="alert"
         class="mb-4 rounded-lg bg-red-50 p-3 text-red-800">{{ actionError() }}</p>
    }
    <fieldset [disabled]="saving()">
      <div class="grid gap-4">
        <mat-form-field appearance="outline"
                        subscriptSizing="fixed"
                        class="w-full">
          <mat-label>Email</mat-label>
          <input matInput
                 type="email"
                 name="email"
                 required
                 email
                 maxlength="320"
                 formControlName="email" />
          <mat-error>Enter a valid email address (up to 320 characters).</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline"
                        subscriptSizing="fixed"
                        class="w-full">
          <mat-label>First name</mat-label>
          <input matInput
                 name="firstName"
                 maxlength="100"
                 formControlName="first_name" />
          <mat-error>Use up to 100 characters.</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline"
                        subscriptSizing="fixed"
                        class="w-full">
          <mat-label>Last name</mat-label>
          <input matInput
                 name="lastName"
                 maxlength="100"
                 formControlName="last_name" />
          <mat-error>Use up to 100 characters.</mat-error>
        </mat-form-field>
      </div>
    </fieldset>

  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button
            type="button"
            mat-dialog-close
            [disabled]="saving()">Cancel</button>
    <button mat-flat-button
            type="submit"
            [disabled]="!canSave">{{ saving() ? 'Saving…' : 'Save' }}</button>
  </mat-dialog-actions>
</form>
