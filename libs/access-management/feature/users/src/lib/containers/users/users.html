<app-page>
  <div pageTitle>
    <p class="mb-2 text-xs font-bold tracking-[0.18em] text-emerald-700 uppercase">Access management</p>
    <h1 class="m-0 text-3xl font-bold tracking-tight text-stone-900 sm:text-4xl">Users</h1>
    <p class="mt-3 text-sm leading-6 text-stone-600">Employee accounts and ERP access.</p>
  </div>
  <div pageActions
       class="flex flex-wrap items-center gap-3">
    <button mat-flat-button
            type="button"
            [disabled]="saving() || loading()"
            (click)="open()">Add user
    </button>
    <app-url-search class="block w-48"
                    label="Search users"
                    placeholder="Enter a name or email"
                    [maxLength]="255"
                    [resetParams]="{ offset: null }" />
    <am-users-filter class="block w-28" />
    <button mat-icon-button
            type="button"
            aria-label="Refresh users"
            title="Refresh"
            [disabled]="saving() || loading()"
            (click)="load()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
  <div pageBody>

    <mat-card appearance="outlined"
              class="mt-7 overflow-hidden">
      <app-ui-state-container [state]="state()"
                              [resolved]="data"
                              [actionError]="actionError()"
                              (actionErrorDismissed)="dismissActionError()"
                              (retry)="load()" />
      <ng-template #data>
        <div class="overflow-x-auto border-t border-stone-200">
          <table mat-table
                 class="w-full"
                 [dataSource]="users()">
            <ng-container matColumnDef="display_name">
              <th *matHeaderCellDef
                  mat-header-cell>Name
              </th>
              <td *matCellDef="let user"
                  mat-cell>{{ user.display_name ?? '—' }}
              </td>
            </ng-container>
            <ng-container matColumnDef="email">
              <th *matHeaderCellDef
                  mat-header-cell>Email
              </th>
              <td *matCellDef="let user"
                  mat-cell>{{ user.email ?? '—' }}
              </td>
            </ng-container>
            <ng-container matColumnDef="status">
              <th *matHeaderCellDef
                  mat-header-cell>Status
              </th>
              <td *matCellDef="let user"
                  mat-cell>
                <am-status-badge [value]="user.status" />
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th *matHeaderCellDef
                  mat-header-cell>Actions
              </th>
              <td *matCellDef="let user"
                  mat-cell>
                <div class="flex flex-wrap gap-1">
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading()"
                          (click)="open(user)">Edit
                  </button>
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading()"
                          (click)="changeStatus(user)">
                    {{ user.status === 'ACTIVE' ? 'Suspend' : 'Activate' }}
                  </button>
                  <button mat-button
                          type="button"
                          (click)="openDetails(details, user)">Access
                  </button>
                </div>
              </td>
            </ng-container>
            <tr *matHeaderRowDef="displayedColumns"
                mat-header-row></tr>
            <tr *matRowDef="let row; columns: displayedColumns"
                mat-row></tr>
            <tr *matNoDataRow
                class="mat-row">
              <td class="mat-cell px-6 py-14 text-center text-sm text-stone-500"
                  [attr.colspan]="displayedColumns.length">No users found
              </td>
            </tr>
          </table>
        </div>
      </ng-template>

      <mat-card-actions class="flex flex-col gap-3 border-t border-stone-200 px-4! py-3! sm:flex-row sm:justify-between sm:px-6!">
        <span class="text-xs text-stone-600">Page {{ offset() / pageSize + 1 }} · Records: {{ users().length }}</span>
        <div class="flex gap-2">
          <button mat-stroked-button
                  type="button"
                  [disabled]="saving() || loading() || offset() === 0"
                  (click)="page(-1)">Previous
          </button>
          <button mat-stroked-button
                  type="button"
                  [disabled]="saving() || loading() || users().length < pageSize"
                  (click)="page(1)">Next
          </button>
        </div>
      </mat-card-actions>
    </mat-card>

  </div>
</app-page>
<ng-template #details
             let-user
             let-dialogRef="dialogRef">
  <h2 mat-dialog-title>User access</h2>
  <mat-dialog-content>
    <am-user-access [user]="user"
                    (closed)="dialogRef.close()"
                    (updated)="userUpdated($event)" />
  </mat-dialog-content>
</ng-template>
