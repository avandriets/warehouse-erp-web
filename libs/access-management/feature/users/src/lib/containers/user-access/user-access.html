<ui-page-layout>
  <nav pageBreadcrumb
       class="flex items-center gap-2"
       aria-label="Breadcrumb">
    <a class="font-medium text-primary hover:underline"
       routerLink="../..">Users</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">User access</span>
  </nav>
  <div pageTitle>
    <h1 class="m-0 text-2xl font-semibold text-on-surface">User access</h1>
    <p class="mt-1 text-sm leading-5 text-muted">Account linking and role assignments.</p>
  </div>
  @if (editor(); as accessEditor) {
    <div pageActions
         class="flex flex-wrap items-center gap-3">
      @if (!accessEditor.auth0Subject()) {
        <button mat-stroked-button
                type="submit"
                form="user-link-form"
                [disabled]="!accessEditor.canLink">Link account
        </button>
      }
      <button mat-flat-button
              type="submit"
              form="role-assignment-form"
              [disabled]="!accessEditor.canAssign">Assign role
      </button>
    </div>
  }
  <div pageBody>
    <ui-state-container [state]="state()"
                        [resolved]="content"
                        (retry)="load()" />
    <ng-template #content>
      @if (user(); as currentUser) {
        <am-user-access-editor [user]="currentUser" />
      }
    </ng-template>
  </div>
</ui-page-layout>
