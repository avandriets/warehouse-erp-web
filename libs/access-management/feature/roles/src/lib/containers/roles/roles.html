<app-page>
  <p pageBreadcrumb>Access management</p>
  <div pageTitle>
    <h1 class="m-0 text-3xl font-bold tracking-tight text-stone-900 sm:text-4xl">Roles and permissions</h1>
    <p class="mt-3 text-sm leading-6 text-stone-600">Permission sets for working in the ERP system.</p>
  </div>
  <div pageActions
       class="flex flex-wrap items-center gap-3">
    <button mat-flat-button
            type="button"
            [disabled]="saving() || loading()"
            (click)="open()">Add role
    </button>
    <app-url-search class="block w-48"
                    label="Search roles"
                    placeholder="Enter a name or code"
                    [maxLength]="255" />
    <am-roles-filter class="block w-28" />
    <button mat-icon-button
            type="button"
            aria-label="Refresh roles"
            title="Refresh"
            [disabled]="saving() || loading()"
            (click)="load()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
  <div pageBody>

    <mat-card appearance="outlined"
              class="mt-7 overflow-hidden">
      <app-ui-state-container [state]="state()"
                              [resolved]="data"
                              [actionError]="actionError()"
                              (actionErrorDismissed)="dismissActionError()"
                              (retry)="load()" />
      <ng-template #data>
        <div class="overflow-x-auto border-t border-stone-200">
          <table mat-table
                 class="w-full"
                 [dataSource]="roles()">
            <ng-container matColumnDef="code">
              <th *matHeaderCellDef
                  mat-header-cell>Code
              </th>
              <td *matCellDef="let role"
                  mat-cell>{{ role.code }}
              </td>
            </ng-container>
            <ng-container matColumnDef="name">
              <th *matHeaderCellDef
                  mat-header-cell>Name
              </th>
              <td *matCellDef="let role"
                  mat-cell>{{ role.name }}
              </td>
            </ng-container>
            <ng-container matColumnDef="active">
              <th *matHeaderCellDef
                  mat-header-cell>Active
              </th>
              <td *matCellDef="let role"
                  mat-cell>
                <am-status-badge [value]="role.active" />
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th *matHeaderCellDef
                  mat-header-cell>Actions
              </th>
              <td *matCellDef="let role"
                  mat-cell>
                <div class="flex flex-wrap gap-1">
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading()"
                          (click)="open(role)">Edit
                  </button>
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading() || !role.active"
                          (click)="deactivate(role)">Deactivate
                  </button>
                  <a mat-button
                     [routerLink]="[role.id, 'permissions']">Permissions</a>
                </div>
              </td>
            </ng-container>
            <tr *matHeaderRowDef="displayedColumns"
                mat-header-row></tr>
            <tr *matRowDef="let row; columns: displayedColumns"
                mat-row></tr>
            <tr *matNoDataRow
                class="mat-row">
              <td class="mat-cell px-6 py-14 text-center text-sm text-stone-500"
                  [attr.colspan]="displayedColumns.length">No roles found
              </td>
            </tr>
          </table>
        </div>
      </ng-template>
    </mat-card>

  </div>
</app-page>
