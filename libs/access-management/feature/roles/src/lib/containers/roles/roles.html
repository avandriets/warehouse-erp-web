<ui-page-layout>
  <p pageBreadcrumb>Access management</p>
  <div pageTitle>
    <h1 class="m-0 text-2xl font-semibold text-on-surface">Roles and permissions</h1>
    <p class="mt-1 text-sm leading-5 text-muted">Permission sets for working in the ERP system.</p>
  </div>
  <div pageActions
       class="flex flex-wrap items-center gap-2">
    <button mat-flat-button
            type="button"
            [disabled]="saving() || loading()"
            (click)="open()">Add role
    </button>
  </div>
  <section pageFilters
           class="flex flex-col gap-3 sm:flex-row sm:items-center"
           aria-label="Role filters">
    <div class="min-w-40">
      <h2 class="m-0 text-sm font-semibold text-on-surface">Find roles</h2>
    </div>
    <ui-query-param-search class="block w-full sm:ml-auto sm:w-64 sm:shrink-0"
                           label="Search roles"
                           placeholder="Name or code"
                           [maxLength]="255" />
    <am-roles-filter class="block w-full sm:w-44 sm:shrink-0" />
    <button mat-icon-button
            type="button"
            aria-label="Refresh roles"
            title="Refresh"
            [disabled]="saving() || loading()"
            (click)="load()">
      <mat-icon>refresh</mat-icon>
    </button>
  </section>
  <div pageBody>
    <ui-state-container class="mt-4"
                        [state]="state()"
                        [resolved]="data"
                        [empty]="data"
                        [rejected]="loadError"
                        [actionError]="actionError()"
                        (actionErrorDismissed)="dismissActionError()"
                        (retry)="load()" />
    <ng-template #loadError
                 let-message
                 let-pending="pending">
      <div class="mb-4 flex flex-col gap-3 rounded-xl border border-error bg-error-container px-4 py-3 text-sm text-on-error-container sm:flex-row sm:items-center"
           role="alert">
        <mat-icon class="shrink-0"
                  aria-hidden="true">error_outline</mat-icon>
        <p class="m-0 min-w-0 flex-1">{{ message }}</p>
        <button mat-stroked-button
                type="button"
                class="shrink-0 self-start sm:self-auto"
                [disabled]="pending"
                (click)="load()">Retry</button>
      </div>
    </ng-template>
    <ng-template #data>
      <mat-card appearance="outlined"
                class="overflow-hidden">
        <div class="overflow-x-auto">
          <table mat-table
                 class="w-full"
                 [dataSource]="visibleRoles()">
            <ng-container matColumnDef="code">
              <th *matHeaderCellDef
                  mat-header-cell>Code
              </th>
              <td *matCellDef="let role"
                  mat-cell>{{ role.code }}
              </td>
            </ng-container>
            <ng-container matColumnDef="name">
              <th *matHeaderCellDef
                  mat-header-cell>Name
              </th>
              <td *matCellDef="let role"
                  mat-cell>
                <a class="font-medium text-primary no-underline hover:underline"
                   [routerLink]="[role.id, 'permissions']">{{ role.name }}</a>
              </td>
            </ng-container>
            <ng-container matColumnDef="active">
              <th *matHeaderCellDef
                  mat-header-cell>Active
              </th>
              <td *matCellDef="let role"
                  mat-cell>
                <am-status-badge [value]="role.active" />
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th *matHeaderCellDef
                  mat-header-cell>Actions
              </th>
              <td *matCellDef="let role"
                  mat-cell>
                <div class="flex flex-wrap gap-1">
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading()"
                          (click)="open(role)">Edit
                  </button>
                  <button mat-button
                          type="button"
                          [disabled]="saving() || loading() || !role.active"
                          (click)="deactivate(role)">Deactivate
                  </button>
                </div>
              </td>
            </ng-container>
            <tr *matHeaderRowDef="displayedColumns"
                class="bg-surface-container!"
                mat-header-row></tr>
            <tr *matRowDef="let row; columns: displayedColumns"
                class="hover:bg-primary-container"
                mat-row></tr>
            <tr *matNoDataRow
                class="mat-row">
              <td class="mat-cell px-6 py-14 text-center text-sm text-muted"
                  [attr.colspan]="displayedColumns.length">No roles found
              </td>
            </tr>
          </table>
        </div>
        <mat-paginator showFirstLastButtons
                       class="border-t border-outline bg-surface-container!"
                       aria-label="Roles pagination"
                       [length]="roles().length"
                       [pageIndex]="pageIndex()"
                       [pageSize]="pageSize()"
                       [pageSizeOptions]="pageSizeOptions"
                       [disabled]="saving() || loading()"
                       (page)="page($event)" />
      </mat-card>
    </ng-template>
  </div>
</ui-page-layout>
