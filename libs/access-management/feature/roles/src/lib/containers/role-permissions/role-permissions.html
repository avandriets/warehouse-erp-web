<app-page>
  <nav pageBreadcrumb
       class="flex items-center gap-2"
       aria-label="Breadcrumb">
    <a class="font-medium text-emerald-700 hover:underline"
       routerLink="../..">Roles and permissions</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Role permissions</span>
  </nav>
  <div pageTitle>
    <h1 class="m-0 text-3xl font-bold tracking-tight text-stone-900 sm:text-4xl">Role permissions</h1>
    <p class="mt-3 text-sm leading-6 text-stone-600">Permissions granted by this role.</p>
  </div>
  @if (editor(); as permissionsEditor) {
    <div pageActions>
      <button mat-flat-button
              type="submit"
              form="role-permissions-form"
              [disabled]="!permissionsEditor.canSave">Save permissions
      </button>
    </div>
  }
  <div pageBody>
    <app-ui-state-container [state]="state()"
                            [resolved]="content"
                            (retry)="load()" />
    <ng-template #content>
      @if (role(); as currentRole) {
        <am-role-permissions-editor [role]="currentRole" />
      }
    </ng-template>
  </div>
</app-page>
