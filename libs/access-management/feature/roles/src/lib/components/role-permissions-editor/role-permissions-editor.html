<mat-card appearance="outlined"
          class="mt-6">
  <mat-card-header>
    <mat-card-title>{{ role().name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ui-state-container [state]="state()"
                        [resolved]="data"
                        [actionError]="actionError()"
                        (actionErrorDismissed)="dismissActionError()"
                        (retry)="load()" />
    <ng-template #data>
      <form id="role-permissions-form"
            [formGroup]="form"
            (ngSubmit)="save()">
        <fieldset>
          <legend class="mb-4 font-semibold text-on-surface">Role permissions</legend>
          <div class="grid gap-3 md:grid-cols-2">
            @for (permission of permissions(); track permission.code) {
              <mat-checkbox [name]="permission.code"
                            [formControl]="form.controls[permission.code]">
                <span class="font-semibold">{{ permission.code }}</span>
                <span class="block text-xs text-muted">{{ permission.description }}</span>
              </mat-checkbox>
            }
          </div>
        </fieldset>
      </form>
    </ng-template>
  </mat-card-content>
</mat-card>
