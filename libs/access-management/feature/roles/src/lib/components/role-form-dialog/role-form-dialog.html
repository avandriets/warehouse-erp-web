<h2 mat-dialog-title>{{ record ? 'Edit role' : 'New role' }}</h2>

<form [formGroup]="form"
      (ngSubmit)="save()">
  <mat-dialog-content>
    @if (actionError()) {
      <p role="alert"
         class="mb-4 rounded-lg bg-error-container p-3 text-on-error-container">{{ actionError() }}</p>
    }
    <fieldset [disabled]="saving()">
      <div class="grid gap-4">
        @if (!record) {
          <mat-form-field appearance="outline"
                          subscriptSizing="fixed"
                          class="w-full">
            <mat-label>Code</mat-label>
            <input matInput
                   name="code"
                   required
                   maxlength="64"
                   pattern="[A-Za-z][A-Za-z0-9_]{1,63}"
                   formControlName="code" />
            <mat-error>Use 2–64 letters, digits or underscores, starting with a letter.</mat-error>
          </mat-form-field>
        }
        <mat-form-field appearance="outline"
                        subscriptSizing="fixed"
                        class="w-full">
          <mat-label>Name</mat-label>
          <input matInput
                 name="name"
                 required
                 maxlength="255"
                 formControlName="name" />
          <mat-error>Enter a name using up to 255 characters.</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline"
                        subscriptSizing="fixed"
                        class="w-full">
          <mat-label>Description</mat-label>
          <input matInput
                 name="description"
                 formControlName="description" />
        </mat-form-field>
        @if (record) {
          <mat-checkbox name="active"
                        formControlName="active">Active
          </mat-checkbox>
        }
      </div>
    </fieldset>

  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button
            type="button"
            mat-dialog-close
            [disabled]="saving()">Cancel
    </button>
    <button mat-flat-button
            type="submit"
            [disabled]="!canSave">{{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
