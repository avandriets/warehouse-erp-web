<section class="flex min-w-0 flex-col">
  @if (header()) {
    <header class="flex flex-col gap-5 border-b border-[var(--mat-sys-outline-variant)] pb-6 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0 flex-1">
        <div class="mb-3 text-sm text-[var(--mat-sys-on-surface-variant)] empty:hidden">
          <ng-content select="[pageBreadcrumb]"></ng-content>
        </div>
        <div class="flex min-w-0 items-start gap-3">
          <ng-content select="[pageBack]"></ng-content>
          <div class="min-w-0">
            <ng-content select="[pageTitle]"></ng-content>
          </div>
        </div>
      </div>
      <div class="flex shrink-0 flex-wrap items-center gap-3">
        <ng-content select="[pageActions]"></ng-content>
      </div>
    </header>
  }

  <div class="min-w-0">
    <ng-content select="[pageBody]"></ng-content>
  </div>
</section>
