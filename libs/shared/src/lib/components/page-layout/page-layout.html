<section class="flex min-w-0 flex-col">
  @if (header()) {
    <header class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0 flex-1">
        <div class="mb-1 text-xs text-muted empty:hidden">
          <ng-content select="[pageBreadcrumb]"></ng-content>
        </div>
        <div class="flex min-w-0 items-start gap-3">
          <ng-content select="[pageBack]"></ng-content>
          <div class="min-w-0">
            <ng-content select="[pageTitle]"></ng-content>
          </div>
        </div>
      </div>
      <div class="flex shrink-0 flex-wrap items-center gap-2">
        <ng-content select="[pageActions]"></ng-content>
      </div>
    </header>
  }

  <div class="mt-7 min-h-18 min-w-0 rounded-[10px] border border-outline bg-(--mat-sys-surface-container-lowest) px-4 py-3.5 empty:hidden">
    <ng-content select="[pageFilters]"></ng-content>
  </div>

  <div class="min-w-0">
    <ng-content select="[pageBody]"></ng-content>
  </div>
</section>
