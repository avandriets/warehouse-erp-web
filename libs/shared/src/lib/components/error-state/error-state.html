<section class="mx-auto flex min-h-[calc(100dvh-10rem)] max-w-3xl items-center">
  <div class="min-w-0">
    <div class="mb-3 text-sm font-semibold tracking-[0.18em] text-primary uppercase">
      <ng-content select="[errorEyebrow]"></ng-content>
    </div>
    <ng-content select="[errorTitle]"></ng-content>
    <div class="mt-5 max-w-2xl text-base leading-7 text-muted sm:text-lg">
      <ng-content select="[errorDescription]"></ng-content>
    </div>
    <div class="mt-4 flex flex-wrap gap-3">
      <ng-content select="[errorActions]"></ng-content>
    </div>
  </div>
</section>
