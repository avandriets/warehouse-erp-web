<mat-form-field appearance="outline"
                subscriptSizing="dynamic"
                class="w-full">
  <mat-icon matIconPrefix
            class="mr-2 shrink-0 text-[var(--mat-sys-on-surface-variant)]"
            aria-hidden="true">search</mat-icon>
  <input matInput
         type="search"
         [attr.aria-label]="label()"
         [placeholder]="placeholder()"
         [maxlength]="maxLength()"
         [formControl]="control" />
</mat-form-field>
