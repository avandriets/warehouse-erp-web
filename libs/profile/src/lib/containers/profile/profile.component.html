<ui-page-layout>
  <h1 pageTitle
      class="m-0 text-2xl font-semibold">My profile</h1>
  <div pageBody
       class="mt-6 max-w-2xl">
    <ui-state-container [state]="state()"
                        [resolved]="profileContent"
                        [actionError]="actionError()"
                        [actionErrorActions]="reloadAction"
                        (actionErrorDismissed)="dismissActionError()"
                        (retry)="load()" />
    <ng-template #reloadAction>
      <p class="mt-2 mb-0">Reloading discards unsaved changes.</p>
      <button mat-stroked-button
              type="button"
              [disabled]="state().pending"
              (click)="load()">Reload profile</button>
    </ng-template>
    <ng-template #profileContent>
      <p class="mb-6 text-sm text-muted">Update your ERP profile and contact email. These details are shared across
        applications.</p>
      <form [formGroup]="form"
            (ngSubmit)="save()">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          @for (field of fields; track field.key) {
            <mat-form-field appearance="outline">
              <mat-label>{{ field.label }}</mat-label>
              <input matInput
                     [type]="field.key === 'email' ? 'email' : 'text'"
                     [formControlName]="field.key"
                     [attr.autocomplete]="field.key === 'email' ? 'email' : field.key === 'first_name' ? 'given-name' : field.key === 'last_name' ? 'family-name' : 'nickname'" />
              <mat-error>Enter a valid email address.</mat-error>
            </mat-form-field>
          }
        </div>
        <button mat-flat-button
                type="submit"
                [disabled]="state().pending || form.invalid || !form.dirty">
          {{ state().saving ? 'Saving…' : 'Save profile' }}
        </button>
      </form>
    </ng-template>
  </div>
</ui-page-layout>
